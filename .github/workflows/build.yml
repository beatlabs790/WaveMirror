name: Build WaveMirror Universal APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Universal Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10'

      - name: Build Signed Release APK
        run: |
          cd app
          gradle assembleRelease --no-daemon

      - name: Prepare Signed APK Output
        run: |
          mkdir -p output_apk
          find app/app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apk/WaveMirror-Signed.apk \;

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaveMirror-Signed-APK
          path: output_apk/WaveMirror-Signed.apk
          if-no-files-found: error
